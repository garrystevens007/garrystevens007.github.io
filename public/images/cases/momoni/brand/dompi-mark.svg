<?xml version="1.0" encoding="UTF-8"?>
<!--
  Dompi app mark: a cream Dompi on the brand orange square. The installer .ico, the Tauri icons and the PNG exports
  are drawn from the same geometry by packaging/tools/GenerateIcons.java; BrandMark in
  frontend/src/components/Brand.tsx mirrors it. Change all of them together.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Dompi">
  <rect width="512" height="512" rx="112" fill="#F97316"/>
  <g transform="translate(56 92) scale(2)">
    <circle cx="128" cy="44" r="26" fill="#FACC15" stroke="#1E293B" stroke-width="6"/>
    <path d="M128 30 L128 58" stroke="#CA8A04" stroke-width="5" stroke-linecap="round"/>
    <rect x="20" y="48" width="160" height="104" rx="28" fill="#FFF7ED" stroke="#1E293B" stroke-width="6"/>
    <rect x="122" y="80" width="58" height="40" rx="14" fill="#FDBA74" stroke="#1E293B" stroke-width="6"/>
    <circle cx="148" cy="100" r="6" fill="#1E293B"/>
    <ellipse cx="48" cy="112" rx="9" ry="6" fill="#FB7185" opacity="0.45"/>
    <ellipse cx="108" cy="112" rx="9" ry="6" fill="#FB7185" opacity="0.45"/>
    <circle cx="62" cy="94" r="7" fill="#1E293B"/>
    <circle cx="94" cy="94" r="7" fill="#1E293B"/>
    <path d="M64 114 Q78 127 92 114" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
